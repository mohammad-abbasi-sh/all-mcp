[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "all-mcp"
version = "0.1.0"
description = "One MCP server for all of Mohammad Abbasi's Turkey, Germany and Bonbama MCPs — search, auto-route, call."
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
all-mcp = "all_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/all_mcp"]
